<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin dashboard</title>
    <link rel="stylesheet" href="css/admin_dashboard.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  </head>
  <body>
    <nav class="sidebar">
      <div class="logo">
        <i class="bi bi-activity"></i>
        <span class="logo-name">Healthy Life</span>
      </div>

      <ul class="navbar-nav text-light">
        <li class="nav-item">
          <a href="" class="nav-link">
            <i class="bi bi-house"></i>
            <span class="link-name">Dashboard</span>
          </a>
        </li>

        <li class="nav-item position-relative">
          <a href="" class="nav-link">
            <i class="bi bi-person-lines-fill"></i>
            <span class="link-name">Patients</span>
          </a>
        </li>

        <li class="nav-item position-relative">
          <a href="" class="nav-link">
            <i class="bi bi-clipboard2-pulse"></i>
            <span class="link-name">Providers</span>
          </a>
        </li>

        <li class="nav-item position-relative">
          <a href="" class="nav-link">
            <i class="bi bi-gear"></i>
            <span class="link-name">Settings</span>
          </a>
        </li>

      </ul>
    </nav>
    <main>
      <div class="dashboard-top-nav">
        <i class="bi bi-list mx-3 js-menu"></i>
        <form action="" class="d-flex" role="search">
          <div class="input-group m-3">
            <i class="bi bi-search input-group-text"></i>
            <input class="form-control" type="search" name="search" id="search" placeholder="Search" aria-label="Search">
             <button class="btn btn-primary">Search</button>
          </div>          
        </form>
      </div>
    </main>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script>
    let sidebar = document.querySelector('.sidebar');
    let sidebarBtn = document.querySelector('.js-menu');

    sidebarBtn.addEventListener('click', ()=>{
      sidebar.classList.toggle('close');
    });
  </script>
</html>
